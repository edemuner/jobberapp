services:
  redis:
    container_name: redis_container
    image: redis:alpine
    restart: always
    ports:
      - '6380:6379'
    command: redis-server --loglevel warning
    volumes:
      - ./docker-volumes/cache:/data
  mongodb:
    container_name: mongodb_container
    image: mongo:latest
    restart: always
    ports:
      - '27018:27017'
    volumes:
      - ./docker-volumes/data:/data/db
  mysql:
    container_name: mysql_container
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_USER=jobber
      - MYSQL_DATABASE=jobber_auth
      - MYSQL_ROOT_PASSWORD=api
      - MYSQL_PASSWORD=api
    volumes:
      - ./docker-volumes/mysql:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - '3307:3306'
  postgres:
    container_name: postgres_container
    image: postgres
    restart: always
    environment:
      - POSTGRES_USER=jobber
      - POSTGRES_DB=jobber_auth
      - POSTGRES_PASSWORD=api
    volumes:
      - ./docker-volumes/postgres:/var/lib/postgresql/data
    ports:
      - '5433:5432'
  rabbitmq:
    container_name: rabbitmq_container
    image: rabbitmq:4.3.2-management-alpine
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=myuser
      - RABBITMQ_DEFAULT_PASS=mypassword
    ports:
      - '5673:5672'
      - '15673:15672'
  elasticsearch:
    container_name: elasticsearch_container
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.3
    restart: always
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.monitoring.collection.enabled=true
    ports:
      - '9200:9200'
      - '9300:9300'
    volumes:
      - ./docker-volumes/elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - elastic
  kibana:
    container_name: kibana_container
    image: docker.elastic.co/kibana/kibana:9.4.3
    restart: always
    environment:
      - ELASTICSEARCH_HOSTS=["http://elasticsearch_container:9200"]
    ports:
      - '5601:5601'
    networks:
      - elastic
    volumes:
      - ./kibana.yml/:/usr/share/kibana/config/kibana.yml:ro
    depends_on:
      - elasticsearch
  notifications:
    container_name: notification_container
    build:
      context: ./server/2-notification-service
      dockerfile: Dockerfile.dev
      args:
        NPM_TOKEN: ${NPM_TOKEN}
    restart: always
    ports:
      - 4001:4001
    env_file: ./server/2-notification-service/.env
    environment:
      - ENABLE_APM=0
      - NODE_ENV=development
      - CLIENT_URL=http://localhost:3000
      - RABBITMQ_ENDPOINT=amqp://myuser:mypassword@rabbitmq_container:5672
      - SENDER_EMAIL=joanne67@ethereal.email
      - SENDER_EMAIL_PASSWORD=NaSydFjCwupj9XRh7Y
      - ELASTIC_SEARCH_URL=http://localhost:9200
      - ELASTIC_APM_SERVER_URL=http://localhost:8200
      - ELASTIC_APM_SECRET_TOKEN=
    depends_on:
      - elasticsearch
      - rabbitmq
  gateway:
    container_name: gateway_container
    build:
      context: ./server/1-gateway-service
      dockerfile: Dockerfile.dev
      args:
        NPM_TOKEN: ${NPM_TOKEN}
    restart: always
    ports:
      - 4000:4000
    env_file: ./server/1-gateway-service/.env
    environment:
      - ENABLE_APM=0
      - GATEWAY_JWT_TOKEN=54a35d06198a39bcabdc07ed6b3bf93e
      - JWT_TOKEN=294e595522316ec1e80d700065e6c184
      - NODE_ENV=development
      - SECRET_KEY_ONE=d2f47ce8a88d1e6d9c757ab8b0b3c172
      - SECRET_KEY_TWO=64a958fca3326cdf3a49aa014fb63322
      - CLIENT_URL=http://localhost:3000
      - AUTH_BASE_URL=http://localhost:4002
      - USERS_BASE_URL=http://localhost:4002
      - GIG_BASE_URL=http://localhost:4002
      - MESSAGE_BASE_URL=http://localhost:4002
      - ORDER_BASE_URL=http://localhost:4002
      - REVIEW_BASE_URL=http://localhost:4002
      - ELASTIC_SEARCH_URL=http://elasticsearch_container:9200
      - ELASTIC_APM_SERVER_URL=http://localhost:8200
      - ELASTIC_APM_SECRET_TOKEN=
      - REDIS_HOST=redis://redis_container:6379
    depends_on:
      - elasticsearch
      - rabbitmq


networks:
  elastic:
    name: elastic